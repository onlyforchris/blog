---
layout: base
---
<style>
  :root {
    --accent: #818cf8;
    --accent-2: #c084fc;
    --accent-strong: #6366f1;
    --ink: #1f2333;
    --ink-soft: #575757;
    --hero-from: #0b1020;
    --hero-to: #1b1740;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
  }
  html { scroll-behavior: smooth; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); }
  a { color: var(--accent-strong); }

  /* Hero with interactive Three.js starfield + glow */
  .hero {
    position: relative; overflow: hidden;
    background:
      radial-gradient(120% 90% at 78% 8%, rgba(192,132,252,.30), transparent 55%),
      radial-gradient(110% 80% at 12% 90%, rgba(99,102,241,.28), transparent 60%),
      linear-gradient(135deg, var(--hero-from), var(--hero-to));
    color: #f8fafc;
    padding: 5rem 0 4rem;
  }
  #hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .hero .hero-inner { position: relative; z-index: 2; max-width: 60rem; margin: 0 auto; padding: 0 1.5rem; }
  .hero h1 { margin: 0 0 .8rem; font-size: 2.9rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
    background: linear-gradient(90deg,#fff,#c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p.lead { margin: 0 0 .6rem; font-size: 1.18rem; color: #d3daf0; }
  .hero p.sub { margin: 0 0 .6rem; font-size: .95rem; color: #9aa4c4; }
  .hero .hero-meta { margin-top: 1.6rem; font-size: .85rem; color: #8b93b5; }
  .hero .hero-meta a { color: #c7d2fe; text-decoration: none; margin-right: 1rem; }
  .hero .hero-meta a:hover { text-decoration: underline; }

  /* Glass article cards */
  .content-wrap { max-width: 60rem; margin: 2.4rem auto 0; padding: 0 1.5rem; }
  .post-list-heading {
    font-size: 1.02rem; letter-spacing: .05em; color: var(--ink-soft);
    text-transform: uppercase; margin-bottom: 1rem;
  }
  .post-list { padding-left: 0; }
  .post-list li {
    list-style: none; margin-bottom: 1rem; padding: 1.1rem 1.3rem;
    border-radius: 14px;
    background: linear-gradient(180deg, rgba(129,140,248,.06), rgba(255,255,255,.02));
    border: 1px solid rgba(99,102,241,.12);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .post-list li:hover { transform: translateY(-2px); box-shadow: 0 12px 30px -18px rgba(99,102,241,.5); border-color: rgba(99,102,241,.35); }
  .post-list .post-meta { color: #828282; font-size: .82rem; margin-right: .5rem; }
  .post-list h3 { margin: .35rem 0 .4rem; font-size: 1.22rem; }
  .post-list .post-link { text-decoration: none; color: var(--ink); font-weight: 600; }
  .post-list .post-link:hover { color: var(--accent-strong); }
  .post-tags { color: #9b9b9b; font-size: .78rem; }
  footer.site-footer { border-color: #ececf1; }
  @media (max-width: 640px){ .hero h1{ font-size: 2.1rem; } }
</style>

<div class="hero">
  <canvas id="hero-canvas"></canvas>
  <div class="hero-inner">
    <h1>{{ site.title }}</h1>
    <p class="lead">{{ site.description }}</p>
    <p class="sub">只写真实工程问题与可复用的结论，不做工具清单和概念拼盘。</p>
    <p class="hero-meta">
      <a href="https://github.com/onlyforchris">GitHub</a>
      <a href="https://github.com/onlyforchris/blog">仓库源码</a>
      <a href="https://onlyforchris.github.io/blog/feed.xml">RSS</a>
    </p>
  </div>
</div>

<div class="content-wrap">
  <h2 class="post-list-heading">文章</h2>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
      <h3><a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a></h3>
      {% if post.tags %}<span class="post-tags">{{ post.tags | join: ' · ' }}</span>{% endif %}
    </li>
    {% endfor %}
  </ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('hero-canvas');
  if (!canvas || typeof THREE === 'undefined') { return; }
  var scene = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  cam.position.z = 4;
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  function resize() {
    var w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
    cam.aspect = w / h; cam.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  resize();
  window.addEventListener('resize', resize);

  var N = 900, pos = [];
  for (var i = 0; i < N; i++) {
    pos.push((Math.random() - 0.5) * 12);
    pos.push((Math.random() - 0.5) * 8);
    pos.push((Math.random() - 0.5) * 8);
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({ color: 0x93a4f5, size: 0.035, transparent: true, opacity: 0.9, sizeAttenuation: true });
  var points = new THREE.Points(geo, mat);
  scene.add(points);

  // interactive parallax: sample star moves slightly with the mouse
  var targetX = 0, targetY = 0, curX = 0, curY = 0;
  window.addEventListener('mousemove', function (e) {
    targetX = (e.clientX / window.innerWidth - 0.5) * 2;
    targetY = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  (function tick() {
    requestAnimationFrame(tick);
    points.rotation.y += 0.0008;
    points.rotation.x += 0.0004;
    curX += (targetX - curX) * 0.02;
    curY += (targetY - curY) * 0.02;
    points.position.x = curX * 0.4;
    points.position.y = -curY * 0.3;
    renderer.render(scene, cam);
  })();
})();
</script>
