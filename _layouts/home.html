---
layout: base
---
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f6f4;
    --surface: #ffffff;
    --ink: #15151a;
    --muted: #6b6b72;
    --line: #ececec;
    --accent: #4f46e5;
    --accent-soft: #eef1ff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
  a { color: var(--accent); text-decoration: none; }
  ::selection { background: var(--accent-soft); }

  /* ---- hero: light, editorial, restrained ---- */
  .hero { position: relative; overflow: hidden; padding: clamp(4.5rem, 11vh, 6.5rem) 0 clamp(3.5rem, 9vh, 5rem); }
  .hero .blob { position: absolute; border-radius: 50%; filter: blur(70px); z-index: 0; }
  .hero .b1 { width: 440px; height: 440px; background: radial-gradient(circle, #dbe1ff, #b6c0ff); opacity: .7; top: -140px; right: -90px; animation: drift 18s ease-in-out infinite alternate; }
  .hero .b2 { width: 380px; height: 380px; background: radial-gradient(circle, #fbe4ef, #f6c9de); opacity: .55; bottom: -150px; left: -70px; animation: drift 24s ease-in-out infinite alternate-reverse; }
  @keyframes drift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(28px,-18px) scale(1.06); } }
  .hero .inner { position: relative; z-index: 1; max-width: 50rem; margin: 0 auto; padding: 0 1.5rem; }
  .hero .eyebrow { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 1.1rem; }
  .hero h1 { font-size: clamp(2.7rem, 7.5vw, 4.5rem); font-weight: 800; line-height: 1.04; letter-spacing: -.03em; margin: 0 0 1.2rem; color: var(--ink); }
  .hero .lead { font-size: clamp(1.05rem, 2.3vw, 1.28rem); color: var(--muted); max-width: 36rem; line-height: 1.6; margin: 0 0 2rem; }
  .hero .links { display: flex; gap: .7rem; flex-wrap: wrap; }
  .hero .pill { padding: .62rem 1.25rem; border: 1px solid var(--line); border-radius: 99px; background: var(--surface); color: var(--ink); font-weight: 500; font-size: .95rem; transition: .18s ease; }
  .hero .pill:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); box-shadow: 0 8px 20px -14px rgba(79,70,229,.5); }
  .hero .pill.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hero .pill.solid:hover { background: #4335cf; }

  /* ---- article cards ---- */
  .content-wrap { max-width: 50rem; margin: 1.5rem auto 0; padding: 0 1.5rem 4rem; }
  .section-label { font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 1.1rem; }
  .post-list { padding-left: 0; display: flex; flex-direction: column; gap: .9rem; }
  .post-list li { list-style: none; margin: 0; }
  .post-card {
    display: block; padding: 1.35rem 1.5rem; border-radius: 18px; background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 10px 30px -26px rgba(0,0,0,.25);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .post-card:hover { transform: translateY(-3px); border-color: #ddd7fa; background: #fdfdff; box-shadow: 0 4px 10px rgba(0,0,0,.03), 0 20px 44px -28px rgba(79,70,229,.35); }
  .post-card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  .post-card .post-meta { color: var(--muted); font-size: .82rem; white-space: nowrap; }
  .post-card h3 { margin: .3rem 0 .45rem; font-size: 1.26rem; font-weight: 700; letter-spacing: -.01em; }
  .post-card .post-link { color: var(--ink); }
  .post-card:hover .post-link { color: var(--accent); }
  .post-card .post-tags { color: var(--muted); font-size: .8rem; }
  footer.site-footer { border-color: var(--line); }
  @media (max-width: 640px) { .post-card .row { flex-direction: column; gap: .2rem; } }
</style>

<div class="hero">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="inner">
    <div class="eyebrow">ENGINEERING · NOTES</div>
    <h1>{{ site.title }}</h1>
    <p class="lead">{{ site.description }}</p>
    <div class="links">
      <a class="pill solid" href="https://github.com/onlyforchris">GitHub</a>
      <a class="pill" href="https://github.com/onlyforchris/blog">仓库源码</a>
      <a class="pill" href="https://onlyforchris.github.io/blog/feed.xml">RSS</a>
    </div>
  </div>
</div>

<div class="content-wrap">
  <div class="section-label">文章</div>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <a class="post-card" href="{{ post.url | relative_url }}">
        <span class="post-meta">{{ post.date | date: "%Y-%m-%d" }}</span>
        <h3>{{ post.title }}</h3>
        {% if post.tags %}<span class="post-tags">{{ post.tags | join: ' · ' }}</span>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
