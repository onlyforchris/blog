---
layout: base
---
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f6f4; --surface:#fff; --ink:#15151a; --muted:#6b6b72; --line:#ececec; --accent:#4f46e5; --accent-soft:#eef1ff; }
  [data-theme="dark"] { --bg:#0e0f14; --surface:#16181f; --ink:#e8e9ef; --muted:#9aa1ad; --line:#262b37; --accent:#8b93f8; --accent-soft:#1a1e2b; }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }

  .deck-wrap { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--bg); }
  .deck-top { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.7rem 1.4rem; border-bottom:1px solid var(--line); z-index:20; }
  .deck-top .back { color:var(--muted); text-decoration:none; font-size:.9rem; }
  .deck-top .back:hover { color:var(--accent); }
  .deck-top .deck-title { font-weight:700; letter-spacing:-.01em; font-size:1.02rem; }
  .deck-tools { display:flex; gap:.5rem; }
  .deck-tools button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; font-size:1rem; transition:.15s; }
  .deck-tools button:hover { border-color:var(--accent); color:var(--accent); }

  .deck { position:relative; flex:1; overflow:hidden; }
  .slide { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:clamp(2rem,6vw,5rem); text-align:center; opacity:0; pointer-events:none; transition:opacity .3s ease; }
  .slide.active { opacity:1; pointer-events:auto; }
  .slide > div { max-width:58rem; }
  .slide h1 { font-size:clamp(2.2rem,6vw,4rem); font-weight:800; letter-spacing:-.02em; line-height:1.08; margin:0 0 1rem; }
  .slide h2 { font-size:clamp(1.6rem,4.2vw,2.6rem); font-weight:700; letter-spacing:-.01em; line-height:1.15; margin:0 0 .9rem; }
  .slide h3 { font-size:1.3rem; font-weight:600; margin:0 0 .6rem; }
  .slide p, .slide li { font-size:clamp(1.05rem,2.2vw,1.35rem); line-height:1.7; color:var(--muted); }
  .slide ul, .slide ol { text-align:left; display:inline-block; margin:0 auto; }
  .slide code { background:var(--accent-soft); padding:.1em .4em; border-radius:6px; font-size:.9em; }
  .slide .accent { color:var(--accent); font-weight:700; }

  .deck-bottom { display:flex; align-items:center; justify-content:center; gap:1.2rem; padding:.7rem 1.4rem; border-top:1px solid var(--line); z-index:20; }
  .deck-bottom .nav { width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:1.3rem; cursor:pointer; line-height:1; transition:.15s; }
  .deck-bottom .nav:hover { border-color:var(--accent); color:var(--accent); }
  .deck-bottom .counter { font-size:.9rem; color:var(--muted); letter-spacing:.04em; min-width:4.5rem; text-align:center; }

  .progress { position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--line); z-index:30; }
  .progress .bar { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),#c084fc); transition:width .25s ease; }

  @media (max-width:560px){ .deck-top .deck-title{ display:none; } .deck-bottom .nav{ width:38px;height:38px; } }
</style>

<div class="deck-wrap">
  <div class="deck-top">
    <a class="back" href="{{ '/' | relative_url }}">← 返回</a>
    <span class="deck-title">{{ page.title }}</span>
    <div class="deck-tools">
      <button data-act="theme" aria-label="切换主题">☾</button>
      <button data-act="full" aria-label="全屏">⛶</button>
    </div>
  </div>
  <div class="deck" id="deck">{{ content }}</div>
  <div class="deck-bottom">
    <button class="nav prev" data-act="prev" aria-label="上一页">‹</button>
    <div class="counter">1 / <span class="total">0</span></div>
    <button class="nav next" data-act="next" aria-label="下一页">›</button>
  </div>
  <div class="progress"><span class="bar"></span></div>
</div>

<script>
(function () {
  var root = document.documentElement, wrap = document.querySelector('.deck-wrap');
  var deck = document.getElementById('deck'), slides = deck ? deck.querySelectorAll('.slide') : [];
  var totalEl = document.querySelector('.deck-bottom .total'), counter = document.querySelector('.deck-bottom .counter');
  var bar = document.querySelector('.progress .bar');
  var idx = 0;

  // theme apply + toggle
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    var b = document.querySelector('[data-act="theme"]');
    if (b) b.textContent = (t === 'dark') ? '☀' : '☾';
  }
  var saved = null; try { saved = localStorage.getItem('theme'); } catch (e) {}
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

  function show(i) {
    if (!slides.length) return;
    idx = Math.max(0, Math.min(i, slides.length - 1));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === idx); });
    if (totalEl) totalEl.textContent = slides.length;
    if (counter) counter.firstChild.textContent = (idx + 1) + " / ";
    if (bar) bar.style.width = ((idx + 1) / slides.length * 100) + '%';
  }
  var next = function () { show(idx + 1); }, prev = function () { show(idx - 1); };

  document.querySelectorAll('[data-act="prev"]').forEach(function (b) { b.addEventListener('click', prev); });
  document.querySelectorAll('[data-act="next"]').forEach(function (b) { b.addEventListener('click', next); });
  document.querySelector('[data-act="full"]').addEventListener('click', function () {
    if (document.fullscreenElement) { document.exitFullscreen(); } else if (wrap.requestFullscreen) { wrap.requestFullscreen(); }
  });
  document.querySelector('[data-act="theme"]').addEventListener('click', function () {
    var cur = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(cur); try { localStorage.setItem('theme', cur); } catch (e) {}
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || (e.key === 'Enter' && !e.shiftKey)) { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { show(0); }
    else if (e.key === 'End') { show(slides.length - 1); }
    else if (e.key === 'f' || e.key === 'F') { document.querySelector('[data-act="full"]').click(); }
    else if (e.key === 't' || e.key === 'T') { document.querySelector('[data-act="theme"]').click(); }
  });

  // click right half advances, left half goes back
  if (deck) deck.addEventListener('click', function (e) {
    var x = e.clientX, w = deck.clientWidth;
    if (x < w * 0.25) prev(); else if (x > w * 0.75) next();
  });

  show(0);
})();
</script>
