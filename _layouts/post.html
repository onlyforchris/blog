---
layout: base
---
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f6f6f4; --surface:#fff; --ink:#15151a; --muted:#6b6b72; --line:#ececec; --accent:#4f46e5; --accent-soft:#eef1ff; }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; letter-spacing:-0.01em; }
  a { color: var(--accent); }
  .wrap { max-width: 46em; margin: 0 auto; padding: 3.5rem 1.5rem 4rem; }
  .wrap .crumb { font-size:.78rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin-bottom:2.2rem; }
  .crumb a { color: var(--muted); }
  .crumb a:hover { color: var(--accent); }
  article.post header.post-header { margin-bottom: 2.4rem; }
  .post-header h1 { font-size:clamp(1.9rem,5vw,2.6rem); font-weight:800; letter-spacing:-.02em; line-height:1.15; margin:0 0 1rem; }
  .post-meta { color:var(--muted); font-size:.88rem; }
  .post-meta .tags { margin-left:.5rem; color:var(--accent); }
  .post-content { font-size:1.05rem; line-height:1.85; color:#20212a; }
  .post-content h2 { margin:2.4rem 0 .9rem; font-size:1.4rem; font-weight:700; letter-spacing:-.01em; }
  .post-content h3 { margin:1.9rem 0 .7rem; font-size:1.16rem; font-weight:700; }
  .post-content p { margin:0 0 1.15rem; }
  .post-content a { color:var(--accent); }
  .post-content code { background:#f0f0ee; border:1px solid #ececea; padding:.12em .4em; border-radius:6px; font-size:.9em; }
  .post-content pre { background:#f7f7f6; border:1px solid #ececea; color:#1e2130; padding:1.1rem 1.3rem; border-radius:14px; overflow-x:auto; font-size:.92rem; line-height:1.65; }
  .post-content pre code { background:none; border:none; padding:0; }
  .post-content blockquote { border-left:3px solid var(--accent); margin:1.4rem 0; padding:.3rem 1.2rem; color:var(--muted); font-style:italic; }
  .post-content ul, .post-content ol { margin:0 0 1.1rem; padding-left:1.4rem; }
  .post-content table { border-collapse:collapse; margin:1.4rem 0; width:100%; font-size:.95rem; }
  .post-content th, .post-content td { border:1px solid var(--line); padding:.5rem .8rem; text-align:left; }
  .post-content th { background:#fafaf9; font-weight:600; }
  footer.site-footer { border-color: var(--line); }
</style>

<div class="wrap">
  <div class="crumb"><a href="{{ '/' | relative_url }}">← 返回</a></div>
  <article class="post">
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <div class="post-meta">{{ page.date | date: "%Y-%m-%d" }}{% if page.tags %}<span class="tags"># {{ page.tags | join: ' # ' }}</span>{% endif %}</div>
    </header>
    <div class="post-content">{{ content }}</div>
  </article>
</div>
