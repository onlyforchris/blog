---
layout: base
---
<style>
  :root { --accent-strong: #6366f1; --ink: #1f2333; }
  body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); }
  article.post { max-width: 46em; margin: 0 auto; padding: 0 1.5rem 3rem; }
  .post-header { margin-bottom: 2.2rem; }
  .post-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.2; margin: 0 0 .6rem; }
  .post-meta { color: #828282; font-size: .88rem; }
  .post-meta .tags { margin-left: .5rem; color: var(--accent-strong); }
  .post-content { font-size: 1.02rem; line-height: 1.8; }
  .post-content h2 { margin: 2.2rem 0 .8rem; font-size: 1.35rem; font-weight: 700; }
  .post-content h3 { margin: 1.8rem 0 .6rem; font-size: 1.15rem; font-weight: 700; }
  .post-content p { margin: 0 0 1.1rem; }
  .post-content a { color: var(--accent-strong); }
  .post-content code { background: #f0f1f6; padding: .12em .35em; border-radius: 5px; font-size: .9em; }
  .post-content pre { background: #1e2333; color: #e5e7f0; padding: 1rem 1.2rem; border-radius: 10px; overflow-x: auto; font-size: .9rem; line-height: 1.6; }
  .post-content pre code { background: none; color: inherit; padding: 0; }
  .post-content blockquote { border-left: 3px solid var(--accent-strong); margin: 1.2rem 0; padding: .2rem 1.1rem; color: #575757; }
  .post-content table { border-collapse: collapse; margin: 1.2rem 0; width: 100%; }
  .post-content th, .post-content td { border: 1px solid #e6e8f0; padding: .45rem .7rem; text-align: left; font-size: .92rem; }
  .post-content th { background: #f6f7fb; }
  footer.site-footer { border-color: #ececf1; }
</style>

<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      {{ page.date | date: "%Y-%m-%d" }}
      {% if page.tags %}<span class="tags"># {{ page.tags | join: ' # ' }}</span>{% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
